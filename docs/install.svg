<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 266" width="880" height="266" role="img" aria-labelledby="t d">
  <title id="t">Installing CursorClip</title>
  <desc id="d">Step 1: load the extension folder unpacked in Chrome. Step 2, optional: run install.bat to register the native helper. Step 3: the options page confirms the helper is installed.</desc>
  <rect x="1" y="1" width="878" height="264" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/></marker></defs>
  <g font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
    <!-- Step 1 -->
    <rect x="30" y="30" width="250" height="176" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="50" y="60" font-size="13" font-weight="700" fill="#1f2328">1 · LOAD UNPACKED</text>
    <rect x="50" y="76" width="210" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="62" y="96" font-size="12.5" fill="#57606a" font-family="Consolas, monospace">chrome://extensions</text>
    <rect x="50" y="116" width="140" height="28" rx="14" fill="#0969da"/>
    <text x="120" y="135" text-anchor="middle" font-size="12.5" fill="#ffffff" font-weight="600">Load unpacked</text>
    <text x="50" y="170" font-size="12.5" fill="#57606a">Developer mode on → pick the</text>
    <text x="50" y="186" font-size="12.5" fill="#57606a"><tspan font-family="Consolas, monospace">copiar-elemento/</tspan> folder</text>

    <!-- Step 2 -->
    <rect x="315" y="30" width="250" height="176" rx="14" fill="#ddf4ff" stroke="#80ccff"/>
    <text x="335" y="60" font-size="13" font-weight="700" fill="#0550ae">2 · HELPER (OPTIONAL)</text>
    <rect x="335" y="76" width="210" height="62" rx="6" fill="#1f2328"/>
    <text x="347" y="98" font-size="12" fill="#7ee787" font-family="Consolas, monospace">&gt; install.bat</text>
    <text x="347" y="118" font-size="12" fill="#c9d1d9" font-family="Consolas, monospace">Ayudante instalado</text>
    <text x="335" y="166" font-size="12.5" fill="#0550ae">Windows only · current user,</text>
    <text x="335" y="182" font-size="12.5" fill="#0550ae">no admin rights needed</text>

    <!-- Step 3 -->
    <rect x="600" y="30" width="250" height="176" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="620" y="60" font-size="13" font-weight="700" fill="#1f2328">3 · CHECK OPTIONS</text>
    <rect x="620" y="76" width="210" height="52" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="620" y="76" width="5" height="52" fill="#1a7f37"/>
    <text x="636" y="98" font-size="12.5" fill="#1a7f37" font-weight="600">✓ Ayudante instalado</text>
    <text x="636" y="116" font-size="11.5" fill="#57606a">pastes as a file attachment</text>
    <text x="620" y="166" font-size="12.5" fill="#57606a">Opens by itself on first install;</text>
    <text x="620" y="182" font-size="12.5" fill="#57606a">"Volver a comprobar" re-checks</text>

    <path d="M 284 110 H 310" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
    <path d="M 569 110 H 595" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
    <text x="30" y="240" font-size="12.5" fill="#57606a">Without the helper it still works: the .md goes to Downloads/copiar-elemento and the clipboard gets its @"path".</text>
  </g>
</svg>
