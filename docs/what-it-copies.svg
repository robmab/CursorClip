<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="t d">
  <title id="t">What CursorClip copies</title>
  <desc id="d">A markdown file with the element selector and size, page URL, HTML or a structure outline, matched CSS rules with their source file, inherited rules, resolved CSS variables and non-default computed values.</desc>
  <rect x="1" y="1" width="878" height="328" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <g font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
    <!-- The .md file -->
    <rect x="40" y="36" width="380" height="258" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <path d="M 40 46 a 10 10 0 0 1 10 -10 h 360 a 10 10 0 0 1 10 10 v 24 h -380 z" fill="#eaeef2"/>
    <text x="56" y="59" font-size="13" fill="#656d76" font-family="Consolas, monospace">span.title.md</text>
    <g font-family="Consolas, monospace" font-size="12.5">
      <text x="56" y="94" fill="#1f2328"><tspan font-weight="700">Element:</tspan> `a.card-title &gt; span` · 181×24</text>
      <text x="56" y="114" fill="#1f2328"><tspan font-weight="700">Page:</tspan> https://app.local/clients?id=7</text>
      <text x="56" y="142" fill="#0550ae">&lt;span class="title"&gt;Clients&lt;/span&gt;</text>
      <text x="56" y="170" fill="#656d76">/* app.css */</text>
      <text x="56" y="188" fill="#1f2328">.title { white-space: pre-wrap; }</text>
      <text x="56" y="210" fill="#656d76">/* Inherited from ancestors */</text>
      <text x="56" y="228" fill="#1f2328">.card-title { color: var(--ink); … }</text>
      <text x="56" y="250" fill="#656d76">/* Variables */</text>
      <text x="56" y="268" fill="#1f2328">--ink: #1f2328;</text>
    </g>

    <!-- Labels -->
    <g font-size="15" fill="#1f2328">
      <g transform="translate(470 66)">
        <circle cx="10" cy="10" r="10" fill="#d63384"/><text x="10" y="15" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">1</text>
        <text x="32" y="15"><tspan font-weight="600">Selector + size + full URL</tspan></text>
      </g>
      <g transform="translate(470 104)">
        <circle cx="10" cy="10" r="10" fill="#d63384"/><text x="10" y="15" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">2</text>
        <text x="32" y="15"><tspan font-weight="600">HTML</tspan> — or a structure outline if it's huge</text>
      </g>
      <g transform="translate(470 142)">
        <circle cx="10" cy="10" r="10" fill="#d63384"/><text x="10" y="15" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">3</text>
        <text x="32" y="15"><tspan font-weight="600">Matched rules</tspan> with their source file</text>
      </g>
      <g transform="translate(470 180)">
        <circle cx="10" cy="10" r="10" fill="#d63384"/><text x="10" y="15" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">4</text>
        <text x="32" y="15"><tspan font-weight="600">Inherited</tspan> font/color from ancestors</text>
      </g>
      <g transform="translate(470 218)">
        <circle cx="10" cy="10" r="10" fill="#d63384"/><text x="10" y="15" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">5</text>
        <text x="32" y="15"><tspan font-weight="600">CSS variables</tspan> resolved to their value</text>
      </g>
      <g transform="translate(470 256)">
        <circle cx="10" cy="10" r="10" fill="#d63384"/><text x="10" y="15" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">6</text>
        <text x="32" y="15"><tspan font-weight="600">Computed values</tspan>, defaults left out</text>
      </g>
    </g>
  </g>
</svg>
