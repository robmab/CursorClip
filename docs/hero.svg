<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="t d">
  <title id="t">CursorClip</title>
  <desc id="d">A paperclip holding a mouse cursor says: It looks like you're trying to copy an element. Would you like help?</desc>
  <rect x="1" y="1" width="878" height="298" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <g font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
    <!-- Dotted "page" with the selected element -->
    <rect x="40" y="40" width="250" height="220" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
    <rect x="62" y="62" width="120" height="10" rx="5" fill="#d0d7de"/>
    <rect x="62" y="84" width="200" height="8" rx="4" fill="#e6e9ec"/>
    <rect x="62" y="100" width="170" height="8" rx="4" fill="#e6e9ec"/>
    <rect x="58" y="124" width="214" height="64" rx="8" fill="#d63384" fill-opacity="0.12" stroke="#d63384" stroke-width="2.5"/>
    <rect x="58" y="112" width="104" height="18" rx="4" fill="#d63384"/>
    <text x="64" y="125" font-size="11" fill="#ffffff" font-family="Consolas, monospace">div.card 214×64</text>
    <rect x="72" y="140" width="90" height="10" rx="5" fill="#e8b4cd"/>
    <rect x="72" y="158" width="160" height="8" rx="4" fill="#f0cfe0"/>
    <rect x="62" y="206" width="190" height="8" rx="4" fill="#e6e9ec"/>
    <rect x="62" y="222" width="140" height="8" rx="4" fill="#e6e9ec"/>

    <!-- Mascot: an original paperclip holding a cursor -->
    <g transform="translate(300 70)">
      <path d="M 52 40 L 52 150 A 19 19 0 0 1 14 150 L 14 28 A 27 27 0 0 1 68 28 L 68 140" fill="none" stroke="#8c959f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 52 40 L 52 150 A 19 19 0 0 1 14 150 L 14 28 A 27 27 0 0 1 68 28 L 68 140" fill="none" stroke="#c6ccd3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path transform="translate(40 92) rotate(-18)" d="M 0 0 L 0 34 L 9 25 L 15 39 L 21 36 L 15 23 L 27 23 Z" fill="#1f2328" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
    </g>

    <!-- Speech bubble -->
    <path d="M 410 66 h 400 a 14 14 0 0 1 14 14 v 74 a 14 14 0 0 1 -14 14 h -360 l -26 22 l 4 -22 h -18 a 14 14 0 0 1 -14 -14 v -74 a 14 14 0 0 1 14 -14 z" fill="#fff8c5" stroke="#d4a72c" stroke-width="2"/>
    <text x="420" y="104" font-size="19" fill="#1f2328">It looks like you're trying to copy an element.</text>
    <text x="420" y="134" font-size="19" fill="#1f2328">Would you like help?</text>

    <!-- Name and tagline -->
    <text x="398" y="236" font-size="44" font-weight="700" fill="#1f2328">Cursor<tspan fill="#d63384">Clip</tspan></text>
    <text x="400" y="266" font-size="16" fill="#656d76">Point at any element. Get its HTML and CSS as context for your AI.</text>
  </g>
</svg>
