<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" aria-labelledby="t d">
  <title id="t">CursorClip keeps everything on your computer</title>
  <desc id="d">The page goes to the extension, then to the local helper, then to a hidden file in Temp and the clipboard. Nothing is sent over the network.</desc>
  <rect x="1" y="1" width="878" height="218" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/></marker></defs>
  <g font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
    <rect x="24" y="24" width="660" height="140" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-dasharray="6 5"/>
    <text x="40" y="48" font-size="12" font-weight="700" fill="#57606a">YOUR COMPUTER</text>
    <g font-size="13">
      <rect x="44" y="64" width="130" height="70" rx="10" fill="#ffffff" stroke="#d0d7de"/>
      <text x="109" y="94" text-anchor="middle" font-weight="600" fill="#1f2328">Web page</text>
      <text x="109" y="114" text-anchor="middle" font-size="11.5" fill="#57606a">the element</text>
      <rect x="204" y="64" width="130" height="70" rx="10" fill="#fdf2f8" stroke="#e8b4cd"/>
      <text x="269" y="94" text-anchor="middle" font-weight="600" fill="#1f2328">Extension</text>
      <text x="269" y="114" text-anchor="middle" font-size="11.5" fill="#57606a">builds the .md</text>
      <rect x="364" y="64" width="130" height="70" rx="10" fill="#ddf4ff" stroke="#80ccff"/>
      <text x="429" y="94" text-anchor="middle" font-weight="600" fill="#1f2328">Helper</text>
      <text x="429" y="114" text-anchor="middle" font-size="11.5" fill="#57606a">native messaging</text>
      <rect x="524" y="64" width="140" height="70" rx="10" fill="#ffffff" stroke="#d0d7de"/>
      <text x="594" y="94" text-anchor="middle" font-weight="600" fill="#1f2328">Temp + clipboard</text>
      <text x="594" y="114" text-anchor="middle" font-size="11.5" fill="#57606a">hidden .md file</text>
    </g>
    <path d="M 176 99 H 200" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
    <path d="M 336 99 H 360" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
    <path d="M 496 99 H 520" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>

    <!-- Network: crossed out -->
    <g transform="translate(744 70)">
      <circle cx="40" cy="30" r="30" fill="#f6f8fa" stroke="#d0d7de"/>
      <path d="M 18 30 h 44 M 40 8 c -12 12 -12 32 0 44 M 40 8 c 12 12 12 32 0 44" fill="none" stroke="#8c959f" stroke-width="2"/>
      <path d="M 14 56 L 66 4" stroke="#cf222e" stroke-width="4" stroke-linecap="round"/>
      <text x="40" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#cf222e">no network</text>
    </g>
    <text x="24" y="196" font-size="12.5" fill="#57606a">No servers, no tracking, no accounts. Clicks on the page are blocked while picking, so nothing is triggered by accident.</text>
  </g>
</svg>
