<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 452" width="880" height="452" role="img" aria-labelledby="t d">
  <title id="t">CursorClip compared with VS Code's integrated browser and Claude's element selector</title>
  <desc id="d">Coverage matrix of eleven aspects: selector, HTML, page URL, size, matched CSS rules, inherited rules, CSS variables, computed values, reset rules, screenshot and pasting into any app.</desc>
  <rect x="1" y="1" width="878" height="450" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <g font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="14">
    <!-- Header -->
    <rect x="24" y="24" width="832" height="40" rx="8" fill="#f6f8fa"/>
    <g font-weight="600" fill="#1f2328">
      <text x="40" y="49">What gets copied</text>
      <text x="350" y="49">CursorClip</text>
      <text x="520" y="49">VS Code browser</text>
      <text x="690" y="49">Claude selector</text>
    </g>
    <!-- Rows: y step 32 -->
    <g fill="#1f2328">
      <text x="40" y="92">Selector / path</text>
      <text x="40" y="124">Element HTML</text>
      <text x="40" y="156">Page URL</text>
      <text x="40" y="188">Size</text>
      <text x="40" y="220">Matched CSS rules</text>
      <text x="40" y="252">Inherited rules</text>
      <text x="40" y="284">Resolved CSS variables</text>
      <text x="40" y="316">Computed values</text>
      <text x="40" y="348">Skips reset rules</text>
      <text x="40" y="380">Element screenshot</text>
      <text x="40" y="412">Pastes into any app</text>
    </g>
    <g stroke="#eaeef2"><path d="M 24 102 H 856 M 24 134 H 856 M 24 166 H 856 M 24 198 H 856 M 24 230 H 856 M 24 262 H 856 M 24 294 H 856 M 24 326 H 856 M 24 358 H 856 M 24 390 H 856"/></g>

    <!-- Symbols: Y = check, P = half, N = cross -->
    <defs>
      <g id="y"><circle cx="8" cy="-5" r="9" fill="#dafbe1"/><path d="M 3.5 -5 l 3 3 l 6 -6.5" fill="none" stroke="#1a7f37" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
      <g id="p"><circle cx="8" cy="-5" r="9" fill="#fff8c5"/><path d="M 8 -11 a 6 6 0 0 1 0 12 z" fill="#9a6700"/><circle cx="8" cy="-5" r="6" fill="none" stroke="#9a6700" stroke-width="1.6"/></g>
      <g id="n"><circle cx="8" cy="-5" r="9" fill="#f6f8fa"/><path d="M 4.5 -8.5 l 7 7 m 0 -7 l -7 7" stroke="#8c959f" stroke-width="2" stroke-linecap="round"/></g>
    </defs>
    <g font-size="13" fill="#57606a">
      <!-- CursorClip -->
      <use href="#y" x="350" y="92"/><text x="372" y="92">5 levels</text>
      <use href="#y" x="350" y="124"/><text x="372" y="124">Or outline if huge</text>
      <use href="#y" x="350" y="156"/><text x="372" y="156">Yes</text>
      <use href="#y" x="350" y="188"/><text x="372" y="188">Yes</text>
      <use href="#y" x="350" y="220"/><text x="372" y="220">With source file</text>
      <use href="#y" x="350" y="252"/><text x="372" y="252">Filtered</text>
      <use href="#y" x="350" y="284"/><text x="372" y="284">Only used ones</text>
      <use href="#y" x="350" y="316"/><text x="372" y="316">Non-default only</text>
      <use href="#y" x="350" y="348"/><text x="372" y="348">Yes</text>
      <use href="#n" x="350" y="380"/><text x="372" y="380">No</text>
      <use href="#y" x="350" y="412"/><text x="372" y="412">File or text</text>
      <!-- VS Code -->
      <use href="#y" x="520" y="92"/><text x="542" y="92">Full (long)</text>
      <use href="#y" x="520" y="124"/><text x="542" y="124">Yes</text>
      <use href="#y" x="520" y="156"/><text x="542" y="156">Yes</text>
      <use href="#y" x="520" y="188"/><text x="542" y="188">Yes + position</text>
      <use href="#p" x="520" y="220"/><text x="542" y="220">No source file</text>
      <use href="#y" x="520" y="252"/><text x="542" y="252">Yes</text>
      <use href="#y" x="520" y="284"/><text x="542" y="284">Yes</text>
      <use href="#p" x="520" y="316"/><text x="542" y="316">Long list</text>
      <use href="#n" x="520" y="348"/><text x="542" y="348">No</text>
      <use href="#n" x="520" y="380"/><text x="542" y="380">No</text>
      <use href="#n" x="520" y="412"/><text x="542" y="412">Its own chat</text>
      <!-- Claude -->
      <use href="#y" x="690" y="92"/><text x="712" y="92">Short</text>
      <use href="#y" x="690" y="124"/><text x="712" y="124">Yes + siblings</text>
      <use href="#n" x="690" y="156"/><text x="712" y="156">No</text>
      <use href="#y" x="690" y="188"/><text x="712" y="188">Yes</text>
      <use href="#n" x="690" y="220"/><text x="712" y="220">No</text>
      <use href="#n" x="690" y="252"/><text x="712" y="252">No</text>
      <use href="#n" x="690" y="284"/><text x="712" y="284">No</text>
      <use href="#p" x="690" y="316"/><text x="712" y="316">Fixed 17</text>
      <use href="#n" x="690" y="348"/><text x="712" y="348">No CSS rules</text>
      <use href="#y" x="690" y="380"/><text x="712" y="380">Yes</text>
      <use href="#n" x="690" y="412"/><text x="712" y="412">Claude only</text>
    </g>
    <!-- Legend -->
    <g font-size="12" fill="#57606a">
      <use href="#y" x="40" y="440"/><text x="60" y="440">Covered</text>
      <use href="#p" x="130" y="440"/><text x="150" y="440">Partial</text>
      <use href="#n" x="210" y="440"/><text x="230" y="440">Not covered</text>
    </g>
  </g>
</svg>
